<!-- Tab Switching Logic -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnLogin = document.getElementById('btn-login');
            const btnSignup = document.getElementById('btn-signup');
            const formLogin = document.getElementById('form-login');
            const formSignup = document.getElementById('form-signup');

            const activeClass = ['text-primary', 'border-primary'];
            const inactiveClass = ['text-on-surface-variant', 'border-transparent'];

            function switchTab(showLogin) {
                if (showLogin) {
                    // Update Buttons
                    btnLogin.classList.remove(...inactiveClass);
                    btnLogin.classList.add(...activeClass);
                    btnSignup.classList.remove(...activeClass);
                    btnSignup.classList.add(...inactiveClass);

                    // Update Forms
                    formSignup.classList.remove('show-form');
                    formSignup.classList.add('hide-form');
                    
                    setTimeout(() => {
                        formLogin.classList.remove('hide-form');
                        formLogin.classList.add('show-form');
                    }, 50); // slight delay for smooth exit/enter

                } else {
                    // Update Buttons
                    btnSignup.classList.remove(...inactiveClass);
                    btnSignup.classList.add(...activeClass);
                    btnLogin.classList.remove(...activeClass);
                    btnLogin.classList.add(...inactiveClass);

                    // Update Forms
                    formLogin.classList.remove('show-form');
                    formLogin.classList.add('hide-form');

                    setTimeout(() => {
                        formSignup.classList.remove('hide-form');
                        formSignup.classList.add('show-form');
                    }, 50);
                }
            }

            btnLogin.addEventListener('click', (e) => {
                e.preventDefault();
                switchTab(true);
            });

            btnSignup.addEventListener('click', (e) => {
                e.preventDefault();
                switchTab(false);
            });
        });
    </script>
